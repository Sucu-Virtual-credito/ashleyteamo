# Proxy inverso con HTTPS para Nova.
#
# Twilio y Telegram EXIGEN que la URL del webhook sea HTTPS con certificado
# valido. nginx recibe el trafico publico (443) y lo pasa al Flask interno
# (127.0.0.1:5000). El certificado lo pone Certbot (Let's Encrypt).
#
# Instalacion (como root, despues de editar TU_DOMINIO):
#   sudo cp desplegar/nginx-nova.conf /etc/nginx/sites-available/nova
#   sudo ln -s /etc/nginx/sites-available/nova /etc/nginx/sites-enabled/nova
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # Certificado HTTPS (rellena TU_DOMINIO y TU_CORREO):
#   sudo certbot --nginx -d TU_DOMINIO --agree-tos -m TU_CORREO --redirect
#
# Certbot edita este archivo y agrega solo el bloque de 443 + la redireccion
# de HTTP a HTTPS. No hay que tocarlo a mano.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Nova atiende las llamadas de Twilio y el webhook de Telegram.
    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Twilio espera respuesta rapida; 120s da margen de sobra.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}